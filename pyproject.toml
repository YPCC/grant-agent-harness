[project]
name = "grant-agent-harness"
version = "0.1.0"
description = "Sibling eval harness and MCP/Copilot plugin for YPCC/grant-agent-lab"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Grant Agent Lab Contributors"}]
keywords = ["grant", "nih", "mcp", "copilot", "langgraph", "evaluation", "harness"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
grant-harness = "grant_harness.cli:main"

[project.urls]
Homepage = "https://github.com/YPCC/grant-agent-harness"
Lab = "https://github.com/YPCC/grant-agent-lab"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
